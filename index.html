<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#26262b" />
    <meta name="application-name" content="월요일 파쇄소" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <title>월요일 파쇄소</title>
    <meta
      name="description"
      content="신문지 찢고, 수박 깨고, 뽁뽁이 터뜨리고, 키캡을 누르며 월요일의 열을 식히는 작고 하찮은 스트레스 해소 게임."
    />
    <style>
      @font-face {
        font-family: 'BM JUA';
        src: url('./fonts/jua/Jua-Regular.ttf') format('truetype');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #26262b;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        font-family: 'BM JUA', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      /* 아이템 선택 탭 */
      #tabs {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 12;
        display: flex;
        gap: 5px;
        padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 8px;
        scroll-padding: 0 8px;
        background: linear-gradient(#26262b 62%, rgba(38, 38, 43, 0));
        overflow-x: auto;
        scrollbar-width: none;
      }
      #tabs::-webkit-scrollbar {
        display: none;
      }
      #tabs button {
        flex: 0 0 auto;
        border: none;
        border-radius: 999px;
        padding: 8px 13px;
        font-size: 13px;
        font-family: inherit;
        /* 선택돼도 굵기를 바꾸지 않는다. 폭이 늘어나 마지막 탭이 잘린다 */
        font-weight: 400;
        white-space: nowrap;
        color: #9a9aa4;
        background: rgba(255, 255, 255, 0.07);
      }
      #tabs button.on {
        color: #201f24;
        background: #e8e3d4;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      /* 아이템이 놓이는 자리 — 위 탭과 아래 조작 버튼만큼 비워 둔다 */
      #stage {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 52px);
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 58px);
        touch-action: none;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
      #hint {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 108px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 11px 20px;
        border-radius: 999px;
        background: rgba(20, 20, 24, 0.72);
        color: #f0ece0;
        font-size: 15px;
        letter-spacing: -0.2px;
        white-space: nowrap;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #hint.show {
        opacity: 1;
      }
      #controls {
        position: fixed;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      #controls button {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        color: #f3f0e7;
        font-size: 18px;
        line-height: 38px;
        padding: 0;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #controls button.off {
        color: #878791;
        background: rgba(255, 255, 255, 0.07);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Bh70fGm7.js"></script>
  </head>
  <body>
    <nav id="tabs" aria-label="아이템 선택"></nav>
    <div id="stage"></div>
    <div id="hint" role="status" aria-live="polite"></div>
    <div id="controls" aria-label="게임 설정">
      <button id="sound" type="button" aria-label="효과음 끄기">🔊</button>
      <button id="haptics" type="button" aria-label="진동 끄기">📳</button>
      <button id="reset" type="button" aria-label="현재 장면 새로 시작">↺</button>
    </div>
  </body>
</html>
